<style>
  .course-page .layout{display:flex;gap:44px;max-width:var(--max-width-wide);margin:0 auto;padding:4px 20px 0;align-items:flex-start;}
  .course-page .sidebar{width:274px;flex-shrink:0;position:sticky;top:74px;max-height:calc(100vh - 96px);overflow-y:auto;padding-bottom:24px;scrollbar-width:thin;}
  .course-page .content{flex:1;min-width:0;}
  .course-page .reading{max-width:none;margin:0;padding:0;}

  .course-page .brand{padding:0 4px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
  .course-page .backlink{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;transition:color .15s,gap .15s;}
  .course-page .backlink:hover{color:var(--accent);gap:9px;text-decoration:none;}
  .course-page .brand .kicker{font-family:var(--font-mono);font-size:0.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 7px;}
  .course-page .brand h1{font-size:1.5rem;font-weight:800;letter-spacing:-.025em;color:var(--text);margin:0 0 7px;line-height:1.08;}
  .course-page .brand h1 em{font-style:normal;color:var(--accent);}
  .course-page .brand .sub{font-size:0.775rem;color:var(--text-soft);margin:0;line-height:1.55;}
  .course-page .srcnote{display:inline-block;font-family:var(--font-mono);font-size:0.66rem;letter-spacing:.03em;color:var(--accent);margin-top:9px;border-bottom:1px solid transparent;}
  .course-page .srcnote:hover{border-color:var(--accent);text-decoration:none;}

  .course-page .progress-wrap{margin:16px 0 2px;}
  .course-page .progress-bar{height:4px;background:var(--border-soft);border-radius:4px;overflow:hidden;}
  .course-page .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent));width:0;border-radius:4px;transition:width .5s cubic-bezier(.2,.7,.2,1);}
  .course-page .progress-text{font-family:var(--font-mono);font-size:0.68rem;color:var(--text-muted);margin-top:8px;letter-spacing:.03em;display:flex;justify-content:space-between;}
  .course-page .progress-text b{color:var(--accent);font-weight:700;}

  .course-page .spine{padding:4px 0 0;}
  .course-page .spine-section{padding:0;margin-top:18px;}
  .course-page .spine-section:first-child{margin-top:4px;}
  .course-page .spine-eyebrow{font-family:var(--font-mono);font-size:0.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);padding:0 8px 7px;display:flex;gap:7px;align-items:baseline;}
  .course-page .spine-eyebrow b{color:var(--accent);font-weight:700;}
  .course-page .spine-track{list-style:none;margin:0;padding:0;position:relative;}
  .course-page .spine-track::before{content:"";position:absolute;left:12px;top:11px;bottom:11px;width:2px;background:var(--border-soft);border-radius:2px;}
  .course-page .node{position:relative;display:flex;align-items:center;gap:9px;padding:6px 10px 6px 28px;font-size:0.84rem;color:var(--text-soft);cursor:pointer;border-radius:8px;transition:background .15s,color .15s;}
  .course-page .node:hover{background:var(--bg-soft);color:var(--text);}
  .course-page .node .bead{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--border);transition:background .2s,border-color .2s,box-shadow .2s;z-index:1;}
  .course-page .node.traveled .bead{background:var(--accent);border-color:var(--accent);}
  .course-page .node.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .course-page .node.active .bead{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .course-page .node .nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .course-page .lesson{display:none;}
  .course-page .lesson.active{display:block;animation:cRise .35s cubic-bezier(.2,.7,.2,1);}
  @keyframes cRise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .course-page .lesson-head{position:relative;margin-bottom:32px;padding:2px 0 20px;border-bottom:1px solid var(--border-soft);}
  .course-page .lesson-num{position:absolute;top:-20px;right:-4px;font-family:var(--font-sans);font-weight:800;font-size:5.6rem;line-height:1;color:var(--accent);opacity:.09;pointer-events:none;letter-spacing:-.05em;z-index:0;user-select:none;}
  .course-page .eyebrow{font-family:var(--font-mono);font-size:0.71rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;position:relative;z-index:1;}
  .course-page .lesson-title{font-size:2.15rem;font-weight:800;letter-spacing:-.028em;color:var(--text);margin:0 0 18px;line-height:1.14;position:relative;z-index:1;}
  .course-page .meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1;}
  .course-page .chip{font-family:var(--font-mono);font-size:0.7rem;letter-spacing:.02em;padding:3px 11px;border-radius:30px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-muted);}

  .course-page .lesson h3{font-size:1.32rem;font-weight:700;letter-spacing:-.012em;color:var(--text);margin:42px 0 14px;padding-bottom:10px;position:relative;}
  .course-page .lesson h3::after{content:"";position:absolute;left:0;bottom:0;width:38px;height:3px;background:var(--accent);border-radius:3px;}
  .course-page .lesson h4{font-size:1.02rem;font-weight:700;color:var(--text);margin:24px 0 9px;}
  .course-page .lesson p{margin:13px 0;font-size:0.955rem;color:var(--text-soft);line-height:1.78;}
  .course-page .lesson ul,.course-page .lesson ol{margin:13px 0;padding-left:20px;}
  .course-page .lesson li{margin:7px 0;font-size:0.955rem;color:var(--text-soft);line-height:1.72;}
  .course-page .lesson li::marker{color:var(--text-muted);}
  .course-page .lesson strong{color:var(--text);font-weight:700;}
  .course-page .lesson a{color:var(--accent);border-bottom:1px solid var(--accent-soft);}
  .course-page .lesson a:hover{border-bottom-color:var(--accent);text-decoration:none;}

  .course-page .card{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:17px 21px;margin:18px 0;}
  .course-page .card ul{margin:4px 0;}
  .course-page .callout{position:relative;background:var(--accent-soft);border:1px solid transparent;border-radius:var(--radius);padding:15px 18px 15px 22px;margin:18px 0;font-size:0.9rem;color:var(--text-soft);line-height:1.7;}
  .course-page .callout::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--accent);border-radius:3px;}
  .course-page .callout strong{color:var(--text);}
  .course-page .tip{background:var(--bg-soft);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:13px 16px;margin:18px 0;font-size:0.885rem;color:var(--text-soft);line-height:1.7;}
  .course-page .tip strong{color:var(--text);}
  .course-page .example{background:var(--bg-soft);border:1px dashed var(--border);border-radius:8px;padding:15px 18px;margin:16px 0;font-size:0.9rem;color:var(--text-soft);font-style:italic;line-height:1.7;}

  .course-page table{border-collapse:separate;border-spacing:0;width:100%;margin:18px 0;font-size:0.865rem;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;table-layout:fixed;}
  .course-page th,.course-page td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);word-break:keep-all;overflow-wrap:break-word;line-height:1.62;}
  .course-page th{background:var(--table-head);color:var(--text);font-weight:700;font-size:0.8rem;}
  .course-page td{color:var(--text-soft);}
  .course-page tr:last-child td{border-bottom:none;}
  .course-page td strong{color:var(--accent);font-weight:700;}

  .course-page code{font-family:var(--font-mono);font-size:0.82em;background:var(--bg-code);color:var(--text);padding:2px 6px;border-radius:5px;}
  .course-page pre{background:var(--bg-code);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:16px 0;overflow-x:auto;font-family:var(--font-mono);font-size:0.82rem;line-height:1.6;color:var(--text);}
  .course-page pre code{background:none;padding:0;font-size:1em;}

  .course-page .lesson img{max-width:100%;height:auto;display:block;margin:16px 0;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--bg-soft);}
  .course-page figure{margin:16px 0;}
  .course-page figure img{margin:0 0 6px;}
  .course-page figcaption{font-size:0.8rem;color:var(--text-muted);font-family:var(--font-mono);letter-spacing:.02em;}

  .course-page .next{margin-top:44px;padding:17px 20px;border-radius:var(--radius);background:var(--bg-soft);border:1px solid var(--border);display:flex;gap:13px;align-items:flex-start;font-size:0.92rem;color:var(--text-soft);line-height:1.6;}
  .course-page .next .arrow{color:var(--accent);font-size:1.15rem;line-height:1.2;font-weight:700;}
  .course-page .next b{color:var(--accent);font-weight:700;}

  .course-page .lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 8px;}
  .course-page .lnav{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-soft);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .15s;min-width:0;font-family:inherit;}
  .course-page .lnav:hover{border-color:var(--accent);background:var(--bg-soft);}
  .course-page .lnav.next-btn{text-align:right;align-items:flex-end;}
  .course-page .lnav.next-btn:hover{transform:translateX(3px);}
  .course-page .lnav.prev-btn:hover{transform:translateX(-3px);}
  .course-page .lnav .lnav-dir{font-family:var(--font-mono);font-size:0.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
  .course-page .lnav .lnav-title{font-size:0.9rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .course-page .lnav.empty{visibility:hidden;}

  .course-page .roadmap{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:18px 0;}
  .course-page .rm{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .course-page .rm .rk{font-family:var(--font-mono);font-size:0.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
  .course-page .rm h5{font-size:0.97rem;font-weight:700;margin:5px 0 5px;color:var(--text);}
  .course-page .rm p{font-size:0.82rem;color:var(--text-soft);margin:0;line-height:1.55;}

  .course-page :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  @media (max-width:900px){
    .course-page .layout{flex-direction:column;gap:20px;}
    .course-page .sidebar{width:100%;position:static;max-height:none;}
    .course-page .spine{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
    .course-page .spine-track::before{display:none;}
    .course-page .lesson-title{font-size:1.7rem;}
    .course-page .lesson-num{font-size:4rem;}
  }
  @media (max-width:560px){.course-page .spine{grid-template-columns:1fr;}.course-page .lesson-nav{grid-template-columns:1fr;}}
  @media (prefers-reduced-motion:reduce){.course-page *{animation:none!important;transition:none!important;}}
</style>
