<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anthropic Courses — 한글 학습 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#14161d; --ink-2:#1c1f29; --ink-card:#232734;
    --paper:#f6f3ec; --paper-2:#fdfbf6; --paper-edge:#e7e1d3;
    --gold:#cf9b2a; --gold-deep:#8a6512;
    --sage:#5f8d74; --sage-soft:#e4eee7;
    --muted:#6c6760; --muted-dim:#9a948a;
    --track:#3a3f4f; --line-ink:#2c303c;
    --display:"Fraunces",Georgia,serif;
    --body:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--body);background:var(--paper);color:#1f1d1a;
       line-height:1.7;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--gold);color:var(--ink);}
  a{color:inherit;text-decoration:none;}

  /* ===================== HERO ===================== */
  .hero{
    background:
      radial-gradient(120% 80% at 88% -10%, rgba(207,155,42,.14), transparent 55%),
      radial-gradient(90% 60% at 0% 0%, rgba(95,141,116,.10), transparent 55%),
      var(--ink);
    color:#cfcabf;border-bottom:1px solid var(--line-ink);
    padding:64px 40px 56px;position:relative;overflow:hidden;
  }
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1;}
  .hero .kicker{
    font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);margin:0 0 18px;
  }
  .hero h1{
    font-family:var(--display);font-weight:500;font-size:62px;line-height:1.02;
    letter-spacing:-.02em;color:var(--paper);margin:0 0 16px;
  }
  .hero h1 em{font-style:italic;color:var(--gold);}
  .hero .lede{font-size:16px;color:#b4afa1;max-width:560px;margin:0 0 30px;}
  .hero-stat{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:440px;}
  .hero-stat .bar{flex:1;min-width:180px;height:4px;background:var(--line-ink);border-radius:4px;overflow:hidden;}
  .hero-stat .fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:4px;}
  .hero-stat .label{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted-dim);white-space:nowrap;}
  .hero-watermark{
    position:absolute;right:-30px;bottom:-70px;font-family:var(--display);font-weight:500;
    font-size:330px;line-height:1;color:var(--gold);opacity:.05;pointer-events:none;
    letter-spacing:-.05em;z-index:0;font-style:italic;user-select:none;
  }

  /* ===================== CATALOG ===================== */
  .catalog{max-width:1080px;margin:0 auto;padding:56px 40px 120px;}
  .cat-group{margin-bottom:50px;}
  .cat-head{display:flex;align-items:baseline;gap:12px;margin:0 0 20px;padding-bottom:12px;
            border-bottom:1px solid var(--paper-edge);}
  .cat-head .cnum{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.1em;}
  .cat-head h2{font-family:var(--display);font-weight:500;font-size:27px;letter-spacing:-.01em;
               color:var(--ink);margin:0;}
  .cat-head .ko{font-size:13px;color:var(--muted-dim);margin-left:2px;}
  .cat-head .cct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-dim);letter-spacing:.04em;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:16px;
    padding:22px 22px 18px;min-height:174px;transition:transform .18s,box-shadow .18s,border-color .18s;
  }
  .card .ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card .idx{font-family:var(--mono);font-size:11px;color:var(--muted-dim);letter-spacing:.08em;}
  .card h3{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.2;
           letter-spacing:-.01em;color:var(--ink);margin:0 0 9px;}
  .card .desc{font-size:13.5px;color:var(--muted);margin:0;flex:1;line-height:1.6;}
  .card .cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
  .card .open{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--gold-deep);opacity:0;transition:opacity .18s,gap .18s;display:inline-flex;gap:5px;}
  .card .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted-dim);text-transform:uppercase;transition:color .15s;}
  .card .src:hover{color:var(--gold);}

  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 10px;border-radius:30px;
        border:1px solid var(--paper-edge);background:var(--paper);color:var(--muted-dim);}
  .chip.done{background:var(--sage-soft);border-color:#cfe2d6;color:#3f6b53;font-weight:700;}

  /* done card = clickable */
  a.card.done{cursor:pointer;}
  a.card.done:hover{transform:translateY(-3px);box-shadow:0 12px 30px -12px rgba(20,22,29,.28);border-color:var(--gold);}
  a.card.done:hover .open{opacity:1;gap:8px;}
  a.card.done::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;
                      background:var(--gold);border-radius:3px;opacity:.0;transition:opacity .18s;}
  a.card.done:hover::before{opacity:1;}

  /* soon card = dimmed */
  .card.soon{opacity:.62;}
  .card.soon h3{color:#4a4742;}

  .foot{max-width:1080px;margin:0 auto;padding:0 40px 60px;color:var(--muted-dim);font-size:12.5px;font-family:var(--mono);letter-spacing:.03em;}

  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px;}

  @media (max-width:720px){
    .hero{padding:46px 24px 40px;}
    .hero h1{font-size:42px;}
    .hero-watermark{font-size:200px;bottom:-40px;}
    .catalog{padding:40px 24px 90px;}
    .foot{padding:0 24px 50px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto;}}
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <p class="kicker">Anthropic Academy · 한글 학습 노트</p>
      <h1>Anthropic <em>Courses</em></h1>
      <p class="lede">anthropic.skilljar.com의 강의를 한글로 정리한 학습 노트 모음입니다. 강의를 골라 들어가면 레슨별 요약을 볼 수 있습니다.</p>
      <div class="hero-stat">
        <div class="bar"><div class="fill" id="heroFill"></div></div>
        <div class="label" id="heroLabel">— / —</div>
      </div>
    </div>
    <div class="hero-watermark">A</div>
  </header>

  <main class="catalog" id="catalog"></main>

  <div class="foot" id="foot"></div>

<script>
  const SKILLJAR = "https://anthropic.skilljar.com";
  // anthropic.skilljar.com 홈페이지 노출 순서 그대로 (섹션 구분 없는 단일 목록)
  const courses = [
    { title:"Claude 101", slug:"claude-101", file:"claude-101.html", done:true,
      desc:"일상 업무를 위한 Claude 핵심 기능과 활용법, 그리고 더 깊은 학습 자료." },
    { title:"Claude Code 101", slug:"claude-code-101", done:false,
      desc:"일상 개발 흐름에서 Claude Code를 효과적으로 사용하는 법." },
    { title:"Claude Platform 101", slug:"claude-platform-101", done:false,
      desc:"Claude 개발자 플랫폼 위에서 처음부터 빌드하는 법을 배우는 코스." },
    { title:"Introduction to Claude Cowork", slug:"introduction-to-claude-cowork", done:false,
      desc:"Cowork 작업 루프, 플러그인·스킬, 파일·리서치 워크플로우를 다루는 핸즈온." },
    { title:"Claude Code in Action", slug:"claude-code-in-action", done:false,
      desc:"Claude Code를 실제 개발 워크플로우에 통합하기." },
    { title:"AI Fluency: Framework & Foundations", slug:"ai-fluency-framework-foundations", done:false,
      desc:"AI 시스템과 효과적·효율적·윤리적·안전하게 협업하는 법." },
    { title:"Building with the Claude API", slug:"claude-with-the-anthropic-api", done:false,
      desc:"Claude API로 Anthropic 모델을 다루는 전 범위를 아우르는 코스." },
    { title:"Introduction to Model Context Protocol", slug:"introduction-to-model-context-protocol", done:false,
      desc:"Python으로 MCP 서버와 클라이언트를 처음부터 만들기." },
    { title:"AI Fluency for educators", slug:"ai-fluency-for-educators", done:false,
      desc:"교수·교육 설계자·교육 리더가 자신의 수업에 AI Fluency를 적용하기." },
    { title:"AI Fluency for students", slug:"ai-fluency-for-students", done:false,
      desc:"학습·진로 설계·학업 성공을 돕는 AI Fluency 역량을 학생이 기르기." },
    { title:"Model Context Protocol: Advanced Topics", slug:"model-context-protocol-advanced-topics", done:false,
      desc:"샘플링·알림·파일시스템 접근 등 고급 MCP 구현 패턴." },
    { title:"Claude with Amazon Bedrock", slug:"claude-in-amazon-bedrock", done:false,
      desc:"Amazon Bedrock을 통해 Claude를 사용하는 법 (AWS 대상)." },
    { title:"Claude with Google Cloud's Vertex AI", slug:"claude-with-google-vertex", done:false,
      desc:"Google Cloud Vertex AI를 통해 Anthropic 모델을 다루는 전 범위." },
    { title:"Teaching AI Fluency", slug:"teaching-ai-fluency", done:false,
      desc:"강의 환경에서 AI Fluency를 가르치고 평가하는 법." },
    { title:"AI Fluency for nonprofits", slug:"ai-fluency-for-nonprofits", done:false,
      desc:"비영리 전문가가 조직의 임팩트와 효율을 높이는 AI 역량을 기르기." },
    { title:"Introduction to agent skills", slug:"introduction-to-agent-skills", done:false,
      desc:"Claude Code에서 Skills(재사용 가능한 마크다운 지침)를 만들고·구성하고·공유하기." },
    { title:"Introduction to subagents", slug:"introduction-to-subagents", done:false,
      desc:"Claude Code의 서브에이전트로 컨텍스트를 관리하고 작업을 위임하기." },
    { title:"AI Capabilities and Limitations", slug:"ai-capabilities-and-limitations", done:false,
      desc:"AI가 어떻게 작동하는지 — 할 수 있는 것과 없는 것 — 다루는 입문 코스." },
    { title:"AI Fluency for Small Businesses", slug:"ai-fluency-for-small-businesses", done:false,
      desc:"소상공인이 조직의 임팩트와 효율을 높이는 AI 역량을 기르기." },
    { title:"AI Fluency for Builders", slug:"ai-fluency-for-builders", done:false,
      desc:"빌더가 더 빠르게 솔루션을 출시하며 임팩트와 효율을 높이는 AI 역량." },
  ];

  const catalog = document.getElementById("catalog");
  let total = 0, doneCount = 0;

  const grid = document.createElement("div");
  grid.className = "grid";
  courses.forEach((c, i) => {
    total++;
    if (c.done) doneCount++;
    const num = String(i+1).padStart(2,"0");
    const src = `${SKILLJAR}/${c.slug}`;
    const chip = c.done ? `<span class="chip done">✓ 정리 완료</span>` : `<span class="chip">예정</span>`;
    const foot = c.done
      ? `<span class="open">열기 →</span><a class="src" href="${src}" target="_blank" rel="noopener" onclick="event.stopPropagation()">원문 ↗</a>`
      : `<span></span><a class="src" href="${src}" target="_blank" rel="noopener" onclick="event.stopPropagation()">원문 ↗</a>`;
    const inner =
      `<div class="ctop"><span class="idx">${num}</span>${chip}</div>` +
      `<h3>${c.title}</h3><p class="desc">${c.desc}</p>` +
      `<div class="cfoot">${foot}</div>`;
    let el;
    if (c.done) {
      el = document.createElement("a");
      el.href = c.file;
      el.className = "card done";
    } else {
      el = document.createElement("div");
      el.className = "card soon";
    }
    el.innerHTML = inner;
    grid.appendChild(el);
  });
  catalog.appendChild(grid);

  document.getElementById("heroFill").style.width = (doneCount/total*100)+"%";
  document.getElementById("heroLabel").textContent = `${doneCount} / ${total} 강의 정리 완료`;
  document.getElementById("foot").textContent =
    `Anthropic Academy 한글 학습 노트 · 전체 ${total}개 강의 · 출처 anthropic.skilljar.com`;
</script>
</body>
</html>
